groups:
  - name: tekirextra-api
    rules:
      - alert: TekirApiDown
        expr: up{job="tekirextra-api"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "TekirExtra API erişilemiyor"
          description: "Prometheus API metriklerini iki dakikadır alamıyor."
      - alert: TekirApiHighErrorRate
        expr: sum(rate(http_requests_total{job="tekirextra-api",status_code=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total{job="tekirextra-api"}[5m])), 1) > 0.05
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API 5xx oranı yüksek"
          description: "Son 5 dakikada HTTP 5xx oranı %5'i aştı."
      - alert: TekirApiHighLatency
        expr: rate(http_request_duration_seconds_sum{job="tekirextra-api"}[5m]) / clamp_min(rate(http_request_duration_seconds_count{job="tekirextra-api"}[5m]), 1) > 1
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "API yanıt süresi yüksek"
          description: "Ortalama HTTP yanıt süresi 1 saniyeyi aştı."
      - alert: TekirApiRateLimitSpike
        expr: increase(rate_limit_rejections_total{job="tekirextra-api"}[10m]) > 100
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "API rate-limit reddi arttı"
          description: "Son 10 dakikada 100'den fazla istek rate-limit nedeniyle reddedildi."
  - name: tekirextra-worker
    rules:
      - alert: TekirWorkerDown
        expr: up{job="tekirextra-worker"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "TekirExtra worker erişilemiyor"
          description: "Kalıcı e-Belge işleri iki dakikadır işlenemiyor."
      - alert: TekirEbelgeDeadLetter
        expr: ebelge_queue_dead_letter_depth{job="tekirextra-worker"} > 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "e-Belge dead-letter işi oluştu"
          description: "Otomatik denemeleri tükenen en az bir e-Belge işi müdahale bekliyor."
      - alert: TekirEbelgeQueueStale
        expr: ebelge_queue_oldest_job_age_seconds{job="tekirextra-worker"} > 900
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "e-Belge kuyruğunda eski iş var"
          description: "En eski bekleyen e-Belge işi 15 dakikadan uzun süredir tamamlanamadı."
      - alert: TekirEbelgeSchedulerFailing
        expr: increase(ebelge_schedule_runs_total{job="tekirextra-worker",result="failed"}[15m]) > 0
        for: 1m
        labels: { severity: warning }
        annotations:
          summary: "e-Belge periyodik planlayıcısı hata verdi"
          description: "Son 15 dakikada tenant e-Belge planlama çalışması başarısız oldu."
