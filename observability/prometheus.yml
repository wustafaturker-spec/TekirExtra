global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: tekirextra-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3001"]
  - job_name: tekirextra-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
