packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true
overrides:
  proxy-addr: ">=2.0.8"
  multer: ">=2.5.0"
  # SEC-04: mailparser nodemailer'ı sabit sürümle çeker (adres ayrıştırıcı DoS açıkları).
  nodemailer: "10.1.7"
  qs: "6.16.1"
  "exceljs>uuid": "11.1.1"
  "brace-expansion@1": "1.1.21"
  "brace-expansion@2": "2.1.7"
