services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tekir
      POSTGRES_PASSWORD: tekir
      POSTGRES_DB: tekirextra
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekir -d tekirextra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  metabase:
    image: metabase/metabase:latest
    ports:
      - "3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: tekir
      MB_DB_PASS: tekir
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["analitik"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/main.js
    ports:
      - "3001:3001"
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/main.worker.js
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3100:3000"
    environment:
      API_URL: http://api:3001
    depends_on:
      - api
    profiles: ["app"]

volumes:
  postgres-data:
  redis-data:
