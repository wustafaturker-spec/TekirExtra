services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tekir
      POSTGRES_PASSWORD: tekir
      POSTGRES_DB: tekirextra
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tekir -d tekirextra"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tekir
      MINIO_ROOT_PASSWORD: tekir-minio-dev
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  metabase:
    # RPR-07 ertelendi (karar 2026-10-11); sürüm sabit, beklenmedik güncelleme olmasın.
    image: metabase/metabase:v0.63.13
    ports:
      - "3030:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: tekir
      MB_DB_PASS: tekir
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["analitik"]

  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
    depends_on:
      api:
        condition: service_healthy
    profiles: ["observability"]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command: ["--config.file=/etc/alertmanager/alertmanager.yml"]
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    depends_on:
      mailpit:
        condition: service_started
    profiles: ["observability"]

  clamav:
    # Yükleme taraması (dosya-denetimi + clamav.ts): API/worker'da CLAMAV_HOST tanımlıysa
    # her yükleme taranır, tarama yapılamazsa yükleme reddedilir. İmza veritabanı ilk
    # açılışta indirilir (birkaç dakika, ~1 GB bellek). Açmak için:
    #   docker compose --profile tarama up -d clamav   ve .env'de CLAMAV_HOST=localhost
    image: clamav/clamav:1.4
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamav-data:/var/lib/clamav
    profiles: ["tarama"]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/main.js
    ports:
      - "3001:3001"
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: node apps/api/dist/main.worker.js
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3100:3000"
    environment:
      API_URL: http://api:3001
      # Rota koruması; .env.docker'daki değerle aynı olmalı (yoksa panel kapalı kalır).
      OTURUM_ISARETI_SECRET: dev-oturum-isareti-degistir-0123456789abcdef
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
    profiles: ["app"]

volumes:
  clamav-data:
  postgres-data:
  redis-data:
  minio-data:
